<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homenagem ao Mochi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF3C4; --ink:#3B2A20; --card:#FFFFFF; --accent:#FF5A5F; --green:#3DAA6D; --sky:#5BB8F5; --soft:#FFE08A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#2B2119; --ink:#FFF3C4; --card:#3B2D22; --soft:#4A3A2B; }
}
:root[data-theme="dark"]{ --bg:#2B2119; --ink:#FFF3C4; --card:#3B2D22; --soft:#4A3A2B; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif; line-height:1.5;
  overflow-x:hidden; min-height:100vh;
}
main{max-width:640px; margin:0 auto; padding:32px 20px 64px; position:relative; z-index:2; text-align:center}

.photo-wrap{position:relative; width:230px; height:230px; margin:12px auto 0}
.photo{
  width:100%; height:100%; border-radius:50%; border:8px solid var(--sky);
  background:var(--soft) 50% 25%/cover no-repeat; display:grid; place-items:center;
  font-size:96px; cursor:pointer; box-shadow:0 10px 0 var(--green);
  animation:float 3.2s ease-in-out infinite;
}
.photo.has-img{font-size:0}
.badge{
  position:absolute; right:-6px; bottom:6px; background:var(--accent); color:#fff;
  border-radius:50%; width:56px; height:56px; display:grid; place-items:center; font-size:28px;
  animation:beat 1.2s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

h1{font-size:clamp(2.4rem,10vw,3.6rem); line-height:1.05; margin:28px 0 4px; font-weight:700}
.sub{margin:0; font-size:1.15rem; opacity:.8}
.hint{font-size:.85rem; opacity:.65; margin:10px 0 0}
.hint label{text-decoration:underline; cursor:pointer}
#file{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}
#file:focus-visible + label, .photo:focus-visible, button:focus-visible, input:focus-visible{outline:3px solid var(--accent); outline-offset:3px}

.bubble{
  background:var(--card); border-radius:28px; padding:26px 24px; margin:36px 0 0;
  font-size:1.3rem; font-weight:600; position:relative; min-height:150px;
  box-shadow:0 8px 0 var(--sky);
}
.bubble::before{
  content:""; position:absolute; top:-16px; left:50%; margin-left:-16px; width:32px; height:32px;
  background:var(--card); transform:rotate(45deg); border-radius:6px;
}
.caret{display:inline-block; width:3px; height:1.1em; background:var(--accent); vertical-align:-3px; margin-left:2px; animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

section{margin-top:44px}
h2{font-size:1.7rem; margin:0 0 6px}
.lead{margin:0 0 16px; opacity:.8}
button{
  font:inherit; font-weight:600; border:0; cursor:pointer; color:#fff; background:var(--accent);
  padding:14px 26px; border-radius:999px; box-shadow:0 5px 0 rgba(0,0,0,.25);
  transition:transform .08s, box-shadow .08s;
}
button:active{transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.25)}
button.green{background:var(--green)}
.count{font-size:1.1rem; margin-top:14px; min-height:1.6em}

form{display:flex; gap:8px}
input[type=text]{
  flex:1; min-width:0; font:inherit; padding:12px 16px; border-radius:999px;
  border:3px solid var(--sky); background:var(--card); color:var(--ink);
}
ul{list-style:none; padding:0; margin:20px 0 0; display:grid; gap:10px; text-align:left}
li{background:var(--card); border-radius:18px; padding:12px 16px; border-left:8px solid var(--green); animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
li:nth-child(even){border-left-color:var(--accent)}
@keyframes pop{from{transform:scale(.7); opacity:0}to{transform:scale(1); opacity:1}}
footer{margin-top:48px; opacity:.75}

.fx{position:fixed; pointer-events:none; z-index:1; user-select:none}
.rise{bottom:-40px; animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg); opacity:.9}}
.paw{z-index:5; font-size:22px; animation:fade 1.4s ease-out forwards}
@keyframes fade{to{opacity:0; transform:scale(.6)}}
.burst{z-index:6; animation:burst 1.1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(var(--r)); opacity:0}}
@media (prefers-reduced-motion: reduce){
  .photo,.badge,.caret{animation:none}
  .rise,.paw{display:none}
}
</style>
</head>
<body>
<main>
  <div class="photo-wrap">
    <div class="photo" id="photo" role="button" tabindex="0" aria-label="Fazer carinho na foto">🐶</div>
    <div class="badge" aria-hidden="true">❤️</div>
  </div>
  <p class="hint">
    <input type="file" id="file" accept="image/*">
    <label for="file">Escolher foto</label>
  </p>

  <h1 id="nome">Mochi</h1>
  <p class="sub">Para sempre o melhor amigo 🐾</p>

  <div class="bubble"><span id="frase"></span><span class="caret"></span></div>

  <section>
    <h2>Mande um carinho</h2>
    <p class="lead">Toque quantas vezes quiser. Ele sempre adorou.</p>
    <button class="green" id="carinho">Fazer carinho 🐕</button>
    <div class="count" id="contador"></div>
  </section>

  <section>
    <h2>Momentos bons</h2>
    <p class="lead">Escreva uma lembrança que faz sorrir.</p>
    <form id="form">
      <input type="text" id="lembranca" maxlength="120" placeholder="Ex.: quando ele roubou meu chinelo" aria-label="Escreva uma lembrança">
      <button type="submit">Guardar</button>
    </form>
    <ul id="lista"></ul>
  </section>

  <footer>Obrigado por cada abano de rabo. 🦴</footer>
</main>

const $ = id => document.getElementById(id);

// Foto
function setPhoto(url){
  $("photo").style.backgroundImage = 'url("' + url + '")';
  $("photo").classList.add("has-img");
  $("photo").textContent = "";
}
if (FOTO) setPhoto(FOTO);
$("file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => setPhoto(r.result);
  r.readAsDataURL(f);
});

  el.className = "fx " + cls;
  el.textContent = txt;
  el.style.left = x + "px";
  if (y !== null) el.style.top = y + "px";
  if (extra) extra(el);
  document.body.appendChild(el);
  el.addEventListener("animationend", () => el.remove());
}
function burst(x, y, n){
  if (reduce) return;
  for (let i = 0; i < n; i++){
    spawn("burst", EMOJIS[i % EMOJIS.length], x, y, el => {
      el.style.setProperty("--x", rand(-140,140) + "px");
      el.style.setProperty("--y", rand(-200,40) + "px");
      el.style.setProperty("--r", rand(-90,90) + "deg");
      el.style.fontSize = rand(18,32) + "px";
    });
  }
}

// Emojis subindo pela tela
if (!reduce){
  setInterval(() => {
    if (document.querySelectorAll(".rise").length > 14) return;
    spawn("rise", EMOJIS[Math.floor(Math.random()*EMOJIS.length)], rand(0, innerWidth - 30), null, el => {
      el.style.fontSize = rand(18,34) + "px";
      el.style.opacity = rand(.35,.7);
      el.style.animationDuration = rand(7,13) + "s";
    });
  }, 900);
}

// Patinhas seguindo o dedo ou o mouse
let lastPaw = 0;
addEventListener("pointermove", e => {
  const now = Date.now();
  if (reduce || now - lastPaw < 140) return;
  lastPaw = now;
  spawn("paw", "🐾", e.clientX - 10, e.clientY - 10);
});

// Frase digitada letra por letra
(function type(){
  const el = $("frase");
  if (reduce){ el.textContent = FRASE; return; }
  let i = 0;
  const t = setInterval(() => {
    el.textContent = FRASE.slice(0, ++i);
    if (i >= FRASE.length) clearInterval(t);
  }, 45);
})();

// Confete ao abrir a página
addEventListener("load", () => burst(innerWidth/2, innerHeight/2, 24));

// Carinho
let carinhos = 0;
const msgs = [
  "Ele está abanando o rabo! 🐕",
  "Barriguinha liberada! 🥰",
  "Ele pediu mais um! 🎾",
  "Ai, que felicidade! 💛",
  "Ele nunca enjoava de carinho. ❤️"
];
function fazerCarinho(el){
  carinhos++;
  $("contador").textContent = carinhos + (carinhos === 1 ? " carinho" : " carinhos") + " — " + msgs[carinhos % msgs.length];
  const r = el.getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height/2, 8);
}
$("carinho").addEventListener("click", e => fazerCarinho(e.currentTarget));
$("photo").addEventListener("click", e => fazerCarinho(e.currentTarget));
$("photo").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " "){ e.preventDefault(); fazerCarinho(e.currentTarget); }
});

// Lembranças (ficam salvas só neste navegador)
let lembrancas = [];
try { lembrancas = JSON.parse(localStorage.getItem("lembrancas") || "[]"); } catch(e){}
function salvar(){ try { localStorage.setItem("lembrancas", JSON.stringify(lembrancas)); } catch(e){} }
function desenhar(txt, animar){
  const li = document.createElement("li");
  li.textContent = "🐾 " + txt;
  if (!animar) li.style.animation = "none";
  $("lista").prepend(li);
}
lembrancas.forEach(t => desenhar(t, false));
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("lembranca").value.trim();
  if (!v) return;
  lembrancas.push(v);
  salvar();
  desenhar(v, true);
  $("lembranca").value = "";
  burst(innerWidth/2, innerHeight/2, 10);
});
</script>
</body>
</html>
